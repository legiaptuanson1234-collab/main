# Website: build + test cơ bản khi push (GitHub Actions — free cho public repo,
# và cũng free cho private repo (2.000 phút build/tháng)).
# Ollama KHÔNG chạy trên GitHub Actions (model cục bộ ở máy bạn) —
# workflow này CHỈ build website + test pipeline (mock), KHÔNG sinh nội dung.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install & build
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Verify build output
        working-directory: website
        run: node scripts/verify.mjs

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test pipeline (mock, không cần Ollama)
        run: node --test pipeline/test/pipeline.test.ts
      - name: Dry-run với mock (bằng chứng pipeline không crash, không bịa)
        run: node pipeline/src/cli.ts --topic cach-viet-prompt --mode dry-run --mock
      - name: Chạy draft mock vào CI sandbox
        run: node pipeline/src/cli.ts --topic cach-viet-prompt --mode draft --mock
